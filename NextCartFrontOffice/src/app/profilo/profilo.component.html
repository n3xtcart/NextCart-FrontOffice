<div class="container">
    <div class="profile-section">
      <div class="logo">
        <img src="/assets/NEXTR3CART.png" alt="logo" id="logo" />
      </div>
  
      <h3>Profilo Utente</h3>
      <form  #profileForm="ngForm" id="form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="Email"
            disabled
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="Password"
            disabled
          />
        </div>
      </form>
      <div class="logout-section">
        <button (click)="logout()">Logout</button>
      </div>
    </div>

  </div>
