<div class="container">
  <div class="login-section">
    <div class="logo"> <img src="/assets/NEXTR3CART.png" alt="logo" id="logo"/>  </div>
     
    <h3>Accedi</h3>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" id="form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Inserisci la tua email"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Inserisci la tua password"
        />
      </div>
      <button type="submit" [disabled]="!loginForm.form.valid">Accedi</button>
      <div class="crea-account">
        <a href="/registrazione">Crea un account</a>
      </div>
    </form>
  </div>
  <div class="image-section">
    <img src="/assets/spesa.jpg" alt="Shopping" />  
  </div>
</div>
