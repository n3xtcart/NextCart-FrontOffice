<div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 bg-light vh-100 p-0">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link text-dark" href="#">Categorie prodotto</a>
          </li>
          <li class="nav-link active bg-primary text-white">
            La mia lista
          </li>
        </ul>
      </div>
  
      <!-- Contenuto principale -->
      <div class="col-md-10 p-4">
        <h2 class="mb-4">La mia lista</h2>
  
        <div *ngFor="let categoria of listaPerCategoria | keyvalue">
          <h4 class="mt-4">{{ categoria.key }}</h4>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let prodotto of categoria.value">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                    [checked]="prodotto.acquistato"
                    (change)="aggiornaCheck(prodotto, $event)" />
                  
                    <label class="form-check-label ms-2">
                      {{ prodotto.nome }} (x{{ prodotto.quantita }})
                    </label>
                  </div>
              <i class="fas fa-trash-alt text-danger" style="cursor: pointer;" (click)="rimuoviProdotto(categoria.key, prodotto)"></i>
            </li>
          </ul>
        </div>
      </div>
    </div>
  
    <!-- Footer -->
    <div class="position-fixed bottom-0 start-0 w-100 bg-white border-top p-3 d-flex justify-content-between align-items-center">
      <div>
        <i class="fas fa-pen me-2"></i>
        Lista Esselunga
      </div>
      <div>
        Data: 26/10/2020 | N. prodotti: {{ totaleProdotti }} | Prodotti acquistati: {{ prodottiAcquistati }}/{{ totaleProdotti }}
      </div>
      <div style="width: 200px">
        <div class="progress">
          <div class="progress-bar" [style.width.%]="progressPercent"></div>
        </div>
      </div>
    </div>
  </div>
