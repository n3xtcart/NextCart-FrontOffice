<div class="back-section">
  <button (click)="tornaIndietro()">← Indietro</button>
</div>

<div class="container">
  <div class="profile-section">
    <div class="logo">
      <img src="/assets/NEXTR3CART.png" alt="logo" id="logo" />
    </div>

    <h3>Profilo Utente</h3>
    <form #profileForm="ngForm" id="form">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="nome"
          required
          placeholder="nome"
          [disabled]="!isEditable"
        />
      </div>

      <div class="form-group">
        <label for="cognome">Cognome</label>
        <input
          type="text"
          id="cognome"
          name="cognome"
          [(ngModel)]="cognome"
          required
          placeholder="cognome"
          [disabled]="!isEditable"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Email"
          [disabled]="!isEditable"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Password"
          [disabled]="!isEditable"
        />
      </div>
    </form>

    <div class="logout-section">
      <button (click)="logout()">Logout</button>
    </div>

    <div class="aggiorna-section">
      <button *ngIf="!isEditable" (click)="aggiorna()">Aggiorna profilo</button>
    </div>

    <div class="salva-section">
      <button *ngIf="isEditable" (click)="salva()">Salva modifiche</button>
    </div>

    <div class="elimina-section">
      <button (click)="elimina()">Elimina profilo</button>
    </div>
  </div>
</div>
