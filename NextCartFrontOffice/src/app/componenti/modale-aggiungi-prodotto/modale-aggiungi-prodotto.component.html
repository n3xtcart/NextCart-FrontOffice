<div class="modal fade" id="aggiungiProdottoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form (ngSubmit)="conferma()" #formAggiungi="ngForm">
        <div class="modal-header">
          <h5 class="modal-title">Stai aggiungendo alla lista</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <p><strong>{{ nomeProdotto }}</strong></p>
          <p>Categoria: <strong>{{ categoria }}</strong></p>

          <div class="mb-3">
            <label for="quantita" class="form-label">Quantità *</label>
            <input type="number" id="quantita" class="form-control" required [(ngModel)]="quantita" name="quantita">
          </div>

          <div class="mb-3">
            <label for="tipologia" class="form-label">Tipologia</label>
            <select class="form-select" id="tipologia" [(ngModel)]="tipologia" name="tipologia">
              <option>Grammi</option>
              <option>Confezione</option>
              <option>Litri</option>
              <option>Unità</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="note" class="form-label">Note</label>
            <textarea id="note" class="form-control" rows="3" [(ngModel)]="note" name="note"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
          <button type="submit" class="btn btn-primary" [disabled]="!formAggiungi.valid">Conferma</button>
        </div>
      </form>
    </div>
  </div>
</div>
