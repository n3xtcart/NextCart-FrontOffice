<div class="container" >
<div class="registrazione-container">
  <div class="logo">
    <img src="/assets/NEXTR3CART.png" alt="logo" id="logo" />
  </div>
    <h3>Registrazione</h3>
    <form (ngSubmit)="onSubmit()" #registrazioneForm="ngForm">
      <div>
        <label for="nome">Nome</label>
        <input
          type="nome"
          id="nome"
          name="nome"
          [(ngModel)]="nome"
          required
          placeholder="Inserisci il tuo nome"
        />
      </div>
      <div>
        <label for="cognome">Cognome</label>
        <input
          type="cognome"
          id="cognome"
          name="cognome"
          [(ngModel)]="cognome"
          required
          placeholder="Inserisci il tuo cognome"
        />
      </div>
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Inserisci la tua email"
        />
      </div>
      <div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Inserisci la tua password"
        />
      </div>
      <button type="submit" [disabled]="!registrazioneForm.form.valid">Registrati</button>
    </form>
  </div>
  </div>
