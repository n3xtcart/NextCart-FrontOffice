<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La tua lista</title>
  <link rel="stylesheet" href="../Css/stileLista.css">
</head>
<body>

  <div class="wrapper">
    <h1>La tua lista</h1>

    <input type="search" placeholder="Cerca un prodotto..." class="search-input">

    <div class="lista-gruppo">
      <h2>Frutta & verdura</h2>
      <ul class="lista">
        <li class="item completato">
          <input type="checkbox" checked>
          <label>Mele Melinda (1 confezione)</label>
          <button class="delete">❌</button>
        </li>
        <li class="item">
          <input type="checkbox">
          <label>Peperoni rossi (200g)</label>
          <button class="delete">❌</button>
        </li>
      </ul>

      <h2>Carne</h2>
      <ul class="lista">
        <li class="item">
          <input type="checkbox">
          <label>Bovino adulto (500g)<br><small>Nota: va bene anche vitello</small></label>
          <button class="delete">❌</button>
        </li>
        <li class="item">
          <input type="checkbox">
          <label>Salsiccia di pollo (250g)</label>
          <button class="delete">❌</button>
        </li>
      </ul>
    </div>

    <p class="info">📝 Lista Esselunga – 26/10/2020 – 4 prodotti, 1 acquistato</p>
  </div>

</body>
</html>
