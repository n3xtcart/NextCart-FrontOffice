<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aggiungi prodotto</title>
  <link rel="stylesheet" href="../Css/stile3.css">
</head>
<body>

  <!-- MODALE CENTRATA -->
  <div class="overlay" id="modale">
    <div class="modale-box">
      <h2>Stai aggiungendo alla lista:</h2>
      <h3>Mele Melinda</h3>
      <p>Categoria: Frutta & verdura</p>

      <form>
        <!-- RIGA INPUT -->
        <div class="form-row">
          <div>
            <label for="quantita">Quantità</label>
            <input type="number" id="quantita" placeholder="Es. 4" required>
          </div>
          <div>
            <label for="tipo">Tipologia quantità</label>
            <select id="tipo" required>
              <option value="">Scegli</option>
              <option value="pezzi">Pezzi</option>
              <option value="kg">Kg</option>
              <option value="confezioni">Confezioni</option>
            </select>
          </div>
        </div>

        <!-- NOTE -->
        <label for="note">Note</label>
        <textarea id="note" rows="4" placeholder="Scrivi eventuali note..."></textarea>

        <!-- BOTTONI -->
        <div class="form-buttons">
          <button type="submit" class="primary">Conferma</button>
          <button type="button" class="secondary" onclick="closeModal()">Annulla</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JS per chiusura -->
  <script>
    function closeModal() {
      document.getElementById('modale').style.display = 'none';
    }
  </script>

</body>
</html>
