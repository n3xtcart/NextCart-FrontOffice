<div class="container">
  <main class="content">
    <h2>Lista: {{ listaSelezionata?.nome || 'Nessuna selezionata' }}</h2>

    <table class="lista-table" *ngIf="listaSelezionata">
      <tr *ngFor="let prodotto of listaSelezionata.prodotti">
        <td>
          <input type="checkbox" [(ngModel)]="prodotto.acquistato">
        </td>
        <td>{{ prodotto.nome }}</td>
        <td>{{ prodotto.quantita }}</td>
        <td>
          <button (click)="rimuoviProdotto(prodotto)">X</button>
        </td>
      </tr>
    </table>
  </main>
</div>
